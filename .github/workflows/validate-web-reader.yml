name: Validate web reader

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate web data
        run: python scripts/export_web_data.py --output /tmp/quran.json
      - name: Confirm committed export is current
        run: cmp /tmp/quran.json docs/data/quran.json
      - name: Run tests
        run: python -m unittest discover -s tests -v
