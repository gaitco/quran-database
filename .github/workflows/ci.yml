name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  markdown:
    name: Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: "**/*.md"

  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.14"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile Python sources
        run: python -m compileall -q convert_to_sqlite.py convert_to_postgres.py scripts/checksum_text.py scripts/export_schema.py scripts/export_rukus.py scripts/export_web_data.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

  archives:
    name: Data archives
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify compressed SQL dump
        run: unzip -t data/quran.sql.zip

      - name: Verify compressed SQLite database
        run: gzip --test quran.db.gz

      - name: Verify Arabic text against the checksum manifest
        run: |
          gunzip --keep quran.db.gz
          python3 scripts/checksum_text.py

      - name: Check the schema references are up to date
        run: |
          python3 scripts/export_schema.py
          git diff --exit-code -- schema/
